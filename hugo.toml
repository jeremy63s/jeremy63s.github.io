[params.homeInfoParams]
  Title = "Jeremy Siegelman"
  Content = """
I am currently a research associate at the [Clayton foundation for Research](https://www.claytonbiotech.com/about-us/), I am appointed through the UT Austin Department of Neurosurgery under the supervision of [Dr. Benjamin Umlauf](https://sites.utexas.edu/umlauf-lab/research/). I work on engineering molecular systems that improve treatment for some of the most malignant types of cancer. Broadly speaking, my projects pertain to:

- Generating peptides with specific physiochemical properties; and
- Developing systems that utilize those properties to enhance the effectiveness of antineoplastic agents while reducing their harmful side effects, otherwise known as increasing the therapeutic index.

<p style="text-align:center; font-size:calc(1em + 2pt); margin:1.2rem 0;"><a href="/projects/#ongoing-projects" style="color:#5b9df9;">Click here to see a list of my ongoing and past projects</a></p>

I use a combination of computational and wetlab techniques to generate peptide sequences with specific functionalities, including [phage display](https://en.wikipedia.org/wiki/Phage_display) and [BindCraft](https://www.nature.com/articles/s41586-025-09429-6), and have consulted on the optimization of [milestoning](https://ui.adsabs.harvard.edu/abs/2013JChPh.138o4105H/abstract)-generated peptides based on in-vivo data I acquired. For the second part, I use a liposome-based drug delivery system derived from the work of [Kathlynn Brown](https://pmc.ncbi.nlm.nih.gov/articles/PMC3561762/) where I can connect our chosen peptide for via [strain-mediated click chemistry](https://en.wikipedia.org/wiki/Click_chemistry#Strain-promoted_azide-alkyne_cycloaddition_%28SPAAC%29), yielding a fast and inexpensive way to tailor the function of our liposomes to our needs, it just depends on the peptide!

Alongside my work, I am also personally quite interested in understanding how the geometry of neural population activity is connected to its computation. I enjoy using mechanistic interpretability tools such as [MFTMA](https://arxiv.org/abs/2006.01095) and [InterProt](https://pmc.ncbi.nlm.nih.gov/articles/PMC11839115/)/[InterPLM](https://www.nature.com/articles/s41592-025-02836-7) to understand the representational geometry of AI systems under different conditions and am working on a few side projects that I hope will inform me on the connections between some of these geometric properties and their functional outcomes.
"""

